<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Orçamento para Serralheria</title>
    <!-- Incluindo Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos globais usando Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .page {
            /* Adiciona uma transição suave ao alternar as páginas */
            transition: opacity 0.3s ease-in-out;
        }
        /* Garantindo que o canvas ocupe a altura mínima para mostrar o gráfico */
        #simulatorCanvas {
            /* Aumentei um pouco a altura para caber o layout vertical */
            min-height: 800px; 
        }
        /* Estilo para fixar o botão 'Voltar' no rodapé */
        #sticky-footer {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #f3f4f6; /* Cor de fundo para que o botão não "flutue" sobre o conteúdo */
            padding: 1rem 0;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-4xl">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-8 text-center sm:text-4xl">
            Simulador Serralheria <span class="text-blue-600">Pro</span>
        </h1>
        
        <!-- PÁGINA 1: ENTRADA DE DADOS -->
        <div id="page-inputs" class="page">
            <div class="p-6 bg-white rounded-xl shadow-2xl border border-gray-100 transform transition-all hover:shadow-lg">
                <!-- Título da página de entrada (Configuração de Custos), ajustado para mobile na interação anterior -->
                <h2 class="text-xl sm:text-2xl font-bold text-blue-700 mb-6 border-b pb-3">
                    <span class="inline-block align-middle mr-2">⚙️</span> Configuração de Custos
                </h2>
                
                <form id="cost-form" class="space-y-6">
                    <!-- Seção Materiais -->
                    <p class="text-base font-semibold text-gray-600 pt-2 border-t mt-4">Custos de Materiais (Quantidade)</p>
                    <div class="space-y-4" id="material-inputs">
                        <!-- Inputs de Material serão preenchidos via JS -->
                    </div>

                    <!-- Seção Mão de Obra e Lucro -->
                    <p class="text-base font-semibold text-gray-600 pt-2 border-t mt-6">Mão de Obra e Margem de Lucro</p>
                    <div class="space-y-4" id="labor-inputs">
                        <!-- Inputs de Mão de Obra serão preenchidos via JS -->
                    </div>
                </form>

                <div class="mt-10">
                    <button 
                        id="calculate-button"
                        onclick="changePage('results')" 
                        class="w-full py-4 bg-blue-600 text-white text-xl font-bold rounded-xl shadow-lg hover:bg-blue-700 transition duration-300 transform hover:scale-[1.01]">
                        Calcular Orçamento <span class="ml-2">→</span>
                    </button>
                </div>
            </div>
        </div>


        <!-- PÁGINA 2: RESULTADO DO ORÇAMENTO (Inicialmente oculta) -->
        <div id="page-results" class="page hidden pb-20"> <!-- Adicionado pb-20 para evitar que o conteúdo fique atrás do botão fixo -->
            <div class="bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col">
                <h2 class="text-2xl font-bold text-gray-800 p-4 bg-gray-50 border-b">
                    <span class="inline-block align-middle mr-2">💰</span> Resumo Detalhado
                </h2>
                <!-- O Canvas agora ocupa a largura total da página de resultados -->
                <canvas id="simulatorCanvas" class="w-full" width="800" height="800"></canvas>
            </div>
            
            <!-- Botão Fixo de Voltar -->
            <div id="sticky-footer" class="w-full max-w-4xl px-4 sm:px-8">
                <button 
                    onclick="changePage('inputs')" 
                    class="w-full py-3 bg-gray-300 text-gray-800 font-bold rounded-xl shadow-md hover:bg-gray-400 transition duration-150">
                    <span class="mr-2">←</span> Voltar e Editar Custos
                </button>
            </div>
        </div>
        
    </div>


    <script>
        // Configuração inicial do estado da aplicação, agora usando IDs dos inputs HTML
        const state = {
            inputs: {
                // Materiais (com preço unitário)
                qtdBarras: { value: 5, label: 'Barras de Ferro (barra de 6 metros)', unitPrice: 70, id: 'qtdBarras', type: 'number', placeholder: 'Ex: 5' },
                qtdTinta: { value: 1, label: 'Latas de Tinta (3,6L)', unitPrice: 75, id: 'qtdTinta', type: 'number', placeholder: 'Ex: 1' },
                qtdEletrodos: { value: 2, label: 'Pacotes de Eletrodo', unitPrice: 39, id: 'qtdEletrodos', type: 'number', placeholder: 'Ex: 2' },

                // Mão de Obra / Lucro (sem preço unitário definido no state, são apenas valores de entrada)
                horasTrabalho: { value: 8, label: 'Horas de Trabalho', id: 'horasTrabalho', type: 'number', placeholder: 'Ex: 8' },
                valorHora: { value: 55, label: 'Valor da Hora (R$)', id: 'valorHora', type: 'number', placeholder: 'Ex: 55' },
                margemLucro: { value: 30, label: 'Margem de Lucro (%)', id: 'margemLucro', type: 'number', placeholder: 'Ex: 30' }
            },
            results: {
                custoMateriais: 0,
                custoMaoObra: 0,
                custoTotal: 0, // Custo base (Materiais + M.O. Custo)
                valorMargem: 0,
                precoFinal: 0 // Preço de venda (Custo Total + Margem)
            },
            currentPage: 'inputs' // Novo: Controla a página atual ('inputs' ou 'results')
        };

        const canvas = document.getElementById('simulatorCanvas');
        const ctx = canvas.getContext('2d');
        const pageInputs = document.getElementById('page-inputs');
        const pageResults = document.getElementById('page-results');

        // --- FUNÇÕES DE NAVEGAÇÃO E UI ---
        
        /**
         * Alterna a visualização entre a página de inputs e a página de resultados.
         * @param {string} page 'inputs' ou 'results'.
         */
        window.changePage = (page) => {
            if (state.currentPage === page) return;
            state.currentPage = page;
            renderUI();
        };

        /**
         * Atualiza a visibilidade das páginas e o título principal.
         */
        function renderUI() {
            if (state.currentPage === 'inputs') {
                pageInputs.classList.remove('hidden');
                pageResults.classList.add('hidden');
            } else {
                pageInputs.classList.add('hidden');
                pageResults.classList.remove('hidden');
                // Garante que os custos são calculados e o canvas é redesenhado antes de mostrar
                updateApp(); 
            }
        }


        // --- FUNÇÕES AUXILIARES ---

        /**
         * Converte um número para o formato de moeda Real (R$).
         * @param {number} value O valor a ser formatado.
         * @returns {string} O valor formatado como moeda.
         */
        const formatCurrency = (value) => {
            return (value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        /**
         * Gera o markup HTML para um campo de input.
         * @param {string} key Chave do state.inputs.
         * @returns {string} Markup HTML.
         */
        function generateInputMarkup(key) {
            const inputData = state.inputs[key];
            const isMaterial = ['qtdBarras', 'qtdTinta', 'qtdEletrodos'].includes(key);
            
            let unitLabel = 'R$'; // Padrão é R$
            
            // Define a unidade correta
            if (key === 'horasTrabalho') {
                unitLabel = 'Horas';
            } else if (key === 'margemLucro') {
                unitLabel = '%';
            } else if (isMaterial) {
                unitLabel = 'Qtd.';
            }

            const unitPriceDisplay = ''; 
            
            // Classes para alinhamento e espaçamento
            const inputAlignmentClass = 'text-left'; 
            const unitPaddingClass = (key === 'valorHora' || key === 'margemLucro') ? 'pr-12' : 'pr-4'; 
            const unitMarginClass = (key === 'valorHora' || key === 'margemLucro') ? 'mr-4' : 'mr-1'; 
            
            return `
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between">
                    <label for="${inputData.id}" class="text-base font-medium text-gray-700 w-full sm:w-1/2 mb-1 sm:mb-0">
                        ${inputData.label} <span class="text-gray-400 font-normal text-sm">${unitPriceDisplay}</span>
                    </label>
                    <div class="relative w-full sm:w-1/2">
                        <input
                            type="number"
                            id="${inputData.id}"
                            value="${inputData.value}"
                            placeholder="${inputData.placeholder}"
                            min="0"
                            step="${key.includes('Hora') || key.includes('Lucro') ? '0.01' : '1'}"
                            data-key="${key}"
                            class="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-base ${inputAlignmentClass} ${unitPaddingClass}"
                            oninput="handleInputChange(event)"
                        />
                        <!-- A unidade permanece à direita do campo, mas o texto do input está à esquerda -->
                        <span class="absolute right-0 top-0 mt-2.5 ${unitMarginClass} text-gray-500 text-sm font-semibold">${unitLabel}</span>
                    </div>
                </div>
            `;
        }
        
        // Atribui a função ao escopo global para uso no oninput (necessário em HTML de arquivo único)
        window.handleInputChange = (event) => {
            const key = event.target.dataset.key;
            let value = event.target.value;

            // Garante que o valor seja tratado como número
            value = parseFloat(value);
            if (isNaN(value) || value < 0) {
                value = 0;
            }

            // Atualiza o valor no state
            state.inputs[key].value = value;
            
            // Se estiver na página de resultados, atualiza o Canvas imediatamente (útil se o usuário volta e edita)
            if (state.currentPage === 'results') {
                updateApp();
            }
        };

        /**
         * Preenche o DOM com os inputs gerados.
         */
        function renderInputsToDOM() {
            const materialContainer = document.getElementById('material-inputs');
            const laborContainer = document.getElementById('labor-inputs');
            
            // Renderiza Materiais
            materialContainer.innerHTML = '';
            ['qtdBarras', 'qtdTinta', 'qtdEletrodos'].forEach(key => {
                materialContainer.innerHTML += generateInputMarkup(key);
            });

            // Renderiza Mão de Obra / Lucro
            laborContainer.innerHTML = '';
            ['horasTrabalho', 'valorHora', 'margemLucro'].forEach(key => {
                laborContainer.innerHTML += generateInputMarkup(key);
            });
        }


        // --- LÓGICA DE CÁLCULO ---

        /**
         * Recalcula todos os custos e resultados.
         */
        function calculateCosts() {
            const getNum = (key) => state.inputs[key].value || 0;

            const custoBarras = getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice;
            const custoTinta = getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice;
            const custoEletrodos = getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice;
            
            const custoMaoObraBase = getNum('horasTrabalho') * getNum('valorHora');
            const custoMateriais = custoBarras + custoTinta + custoEletrodos;
            
            // Custo Total (Base de custo antes da margem)
            const custoTotal = custoMateriais + custoMaoObraBase;
            
            // Margem de lucro: (Custo Total * Margem %)
            const margem = getNum('margemLucro') / 100;
            const valorMargem = custoTotal * margem;
            
            // Preço Final de Venda
            const precoFinal = custoTotal + valorMargem;

            state.results = {
                custoMateriais: custoMateriais,
                custoMaoObra: custoMaoObraBase, // Mantém o custo base
                custoTotal: custoTotal,
                valorMargem: valorMargem,
                precoFinal: precoFinal
            };
        }
        
        /**
         * Função auxiliar para calcular o custo material para exibição detalhada
         */
        function calculateMaterialCost() {
            const getNum = (key) => state.inputs[key].value || 0;
            return {
                qtdBarras: getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice,
                qtdTinta: getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice,
                qtdEletrodos: getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice
            };
        }


        // --- LÓGICA DE RENDERIZAÇÃO NO CANVAS ---

        /**
         * Desenha texto com quebra de linha.
         * @param {CanvasRenderingContext2D} context Contexto 2D do Canvas.
         * @param {string} text O texto a ser desenhado.
         * @param {number} x Posição X inicial.
         * @param {number} y Posição Y inicial.
         * @param {number} maxWidth Largura máxima para a linha.
         * @param {number} lineHeight Altura da linha.
         * @returns {number} A próxima posição Y após o texto.
         */
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
            // Retorna o Y da última linha desenhada + um pequeno espaçamento para o próximo elemento
            return currentY + lineHeight / 2;
        }


        /**
         * Desenha os resultados do orçamento no Canvas.
         */
        function draw() {
            // Reajusta o tamanho do Canvas para a largura atual do contêiner
            canvas.width = canvas.clientWidth;
            
            const canvasWidth = canvas.clientWidth;
            const canvasHeight = canvas.clientHeight;

            // Limpa o canvas
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // --- CÁLCULOS DE EXIBIÇÃO ---
            // O Preço Final é o valor total de venda.
            const precoFinalVenda = state.results.precoFinal;
            // Para esconder o lucro, faremos o custo de Mão de Obra na tela ser igual ao
            // (Preço Final de Venda - Custo Total de Materiais).
            const precoMaoObraEFinalLucro = precoFinalVenda - state.results.custoMateriais;


            // --- ESTILOS E LAYOUT ---
            const padding = Math.max(20, canvasWidth * 0.04); 
            const textX = padding;
            const valueX = canvasWidth - padding;
            let currentY = padding;

            // Espaçamentos verticais 
            const lineSpacing = canvasWidth > 450 ? 45 : 40; 
            const valueLineSpacing = 22; 
            const smallLineSpacing = 20; 

            // Define a fonte base
            ctx.font = 'Inter'; 

            // Cabeçalho / Título do Recibo
            ctx.font = 'bold 22px Inter'; 
            ctx.fillStyle = '#1e40af'; // Azul escuro
            ctx.textAlign = 'left';

            const titleText = 'Orçamento de Serviços de Serralheria';
            const titleLineHeight = 30; 

            // Quebra de linha dinâmica para o título
            const nextYAfterTitle = wrapText(ctx, titleText, textX, currentY, canvasWidth - 2 * padding, titleLineHeight);
            currentY = nextYAfterTitle; 
            currentY += 5; 

            // Linha de separação
            ctx.strokeStyle = '#9ca3af'; // Cinza
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, currentY);
            ctx.lineTo(canvasWidth - padding, currentY);
            ctx.stroke();
            currentY += 20; 

            // --- SEÇÃO 1: CUSTOS BASE (Materiais e Mão de Obra + Lucro) ---

            // Título Custos Base
            ctx.font = 'bold 16px Inter'; 
            ctx.fillStyle = '#333333';
            ctx.fillText('1. Itens e Serviços', textX, currentY);
            currentY += 15; // Quebra de linha para o disclaimer
            
            // Disclaimer na linha de baixo, alinhado com a esquerda
            ctx.font = '12px Inter'; 
            ctx.fillStyle = '#6b7280'; // Cinza
            // O disclaimer foi alterado para ser mais conciso
            ctx.fillText('(Materiais e Custo do Serviço)', textX + 5, currentY); 
            
            currentY += 25; // Espaço após o disclaimer
            
            // --- Linha: Custo de Materiais ---
            ctx.font = '14px Inter'; 
            ctx.fillStyle = '#555';
            ctx.fillText('Custo Total de Materiais:', textX + 10, currentY);
            currentY += valueLineSpacing; 

            ctx.font = 'bold 16px Inter'; 
            ctx.fillStyle = '#000';
            ctx.fillText(formatCurrency(state.results.custoMateriais), textX + 20, currentY);
            currentY += lineSpacing; 

            // --- Linha: Custo de Mão de Obra E LUCRO ---
            ctx.font = '14px Inter'; 
            ctx.fillStyle = '#555';
            // O rótulo foi ajustado para incluir o lucro implicitamente
            ctx.fillText('Serviços e Mão de Obra (Valor Final):', textX + 10, currentY);
            currentY += valueLineSpacing; 

            ctx.font = 'bold 16px Inter'; 
            ctx.fillStyle = '#000';
            // Usa o valor que inclui o lucro (Total Venda - Materiais)
            ctx.fillText(formatCurrency(precoMaoObraEFinalLucro), textX + 20, currentY);
            currentY += lineSpacing * 1.5; 


            // --- PREÇO FINAL (DESTAQUE VERDE) - NOVO ITEM 2 ---
            
            // Fundo verde para destaque
            ctx.fillStyle = '#dcfce7'; // Verde bem claro
            ctx.fillRect(0, currentY - lineSpacing * 0.8, canvasWidth, lineSpacing * 1.5);

            ctx.strokeStyle = '#10b981'; // Verde
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(padding, currentY - lineSpacing * 0.8);
            ctx.lineTo(canvasWidth - padding, currentY - lineSpacing * 0.8);
            ctx.stroke();

            // Título do Preço Final (Substitui o antigo Custo Total)
            ctx.font = 'bold 18px Inter'; 
            ctx.fillStyle = '#059669'; // Verde mais escuro para contraste
            ctx.fillText('2. PREÇO FINAL SUGERIDO:', textX, currentY);
            currentY += valueLineSpacing + 5; 

            // Valor do Preço Final
            ctx.font = 'bold 28px Inter'; 
            ctx.fillStyle = '#059669';
            ctx.fillText(formatCurrency(precoFinalVenda), textX + 20, currentY);

            ctx.beginPath();
            ctx.moveTo(padding, currentY + lineSpacing * 0.5);
            ctx.lineTo(canvasWidth - padding, currentY + lineSpacing * 0.5);
            ctx.stroke();

            currentY += lineSpacing * 1.5;


            // --- SEÇÃO 3: DETALHES DE MATERIAIS ---
            currentY += 10;
            ctx.font = 'bold 13px Inter'; 
            ctx.fillStyle = '#4b5563'; // Cinza escuro
            ctx.textAlign = 'left';
            ctx.fillText('3. Detalhes do Cálculo de Materiais:', textX, currentY);
            currentY += 25; 

            ctx.font = '12px Inter'; 
            // Recalcula custos detalhados para exibição
            const materialCosts = calculateMaterialCost();
            
            let materialDetailY = currentY;

            Object.keys(state.inputs).forEach(key => {
                if (['qtdBarras', 'qtdTinta', 'qtdEletrodos'].includes(key)) {
                    const input = state.inputs[key];
                    
                    // Busca o custo total de forma correta
                    const costKeyMap = {
                        'qtdBarras': materialCosts.qtdBarras,
                        'qtdTinta': materialCosts.qtdTinta,
                        'qtdEletrodos': materialCosts.qtdEletrodos
                    };
                    const lineTotal = costKeyMap[key]; 
                    
                    // Converte a quantidade para string sem decimais se for um número inteiro, senão usa 2 casas
                    const qtdDisplay = (input.value % 1 === 0) ? input.value.toFixed(0) : input.value.toFixed(2);
                    const totalText = `Custo: ${formatCurrency(lineTotal)}`;
                    
                    // Detalhe de cálculo (agora com o preço unitário)
                    const detailText = `${qtdDisplay} x ${formatCurrency(input.unitPrice)}`;
                    
                    ctx.fillStyle = '#6b7280'; // Cinza médio
                    ctx.textAlign = 'left';
                    // Renderiza apenas o nome do material (sem Qtd.) no resumo
                    ctx.fillText(`${input.label}:`, textX + 15, materialDetailY);
                    materialDetailY += smallLineSpacing - 5; 

                    ctx.font = 'italic 10px Inter'; 
                    ctx.fillText(detailText, textX + 25, materialDetailY);

                    ctx.font = 'bold 12px Inter'; 
                    ctx.textAlign = 'right';
                    ctx.fillText(totalText, valueX, materialDetailY);

                    materialDetailY += smallLineSpacing + 5; 
                    ctx.font = '12px Inter'; // Reseta a fonte para a label
                }
            });
            currentY = materialDetailY + 20;

            // REMOÇÃO DA SEÇÃO 4: MARGEM / LUCRO - A seção foi removida para não explicitar a margem.
            
        }
        
        // Função auxiliar para calcular o custo material para exibição detalhada
        function calculateMaterialCost() {
            const getNum = (key) => state.inputs[key].value || 0;
            return {
                qtdBarras: getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice,
                qtdTinta: getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice,
                qtdEletrodos: getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice
            };
        }


        // --- FLUXO PRINCIPAL ---

        /**
         * Inicializa o aplicativo.
         */
        function init() {
            renderInputsToDOM();
            calculateCosts(); // Calcula custos iniciais
            renderUI();     // Renderiza a página correta
        }

        /**
         * Atualiza o estado (cálculos) e redesenha o Canvas.
         */
        function updateApp() {
            calculateCosts();
            draw();
        }
        
        // Adiciona listener para redimensionamento da janela para garantir a responsividade do Canvas
        window.addEventListener('resize', () => {
            if (state.currentPage === 'results') {
                updateApp();
            }
        });

        // --- CHAMADA DE INICIALIZAÇÃO ---
        window.onload = init;
        
    </script>

</body>
</html>
