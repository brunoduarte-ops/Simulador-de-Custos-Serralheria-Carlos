<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da aba ajustado -->
    <title>Simulador de Custos para Serralheria</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            padding: 20px;
            width: 100%; 
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* --- Input Auxiliar Otimizado para Foco (invisível por padrão) --- */
        #auxiliaryInput {
            position: fixed; 
            top: 0; 
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0; /* Opacidade mínima */
            padding: 0;
            border: none;
            z-index: -10; 
            box-sizing: border-box;
            background-color: transparent;
            color: transparent;
            /* Garante que o input não seja afetado por transformações */
            transform: none; 
        }

        /* --- ADIÇÃO PARA RESPONSIVIDADE --- */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            #simulatorCanvas {
                width: 100%; 
                max-width: 600px; 
                height: auto; 
            }
        }
    </style>
</head>
<body>

    <!-- Título visível ajustado -->
    <h2>Simulador de Custos para Serralheria</h2>
    <canvas id="simulatorCanvas" width="600" height="750"></canvas>

    <!-- Input invisível CORRIGIDO: Move-se para o local do clique para forçar o teclado -->
    <input type="text" id="auxiliaryInput" inputmode="decimal"> 

    <script>
        const canvas = document.getElementById('simulatorCanvas');
        const ctx = canvas.getContext('2d');
        const auxiliaryInput = document.getElementById('auxiliaryInput');

        // --- INÍCIO DA CORREÇÃO AVANÇADA PARA ESCALA E DESENHO ---
        // Garante que o desenho interno do canvas se ajuste se a janela for redimensionada (mobile)
        window.addEventListener('load', () => {
            const resizeCanvas = () => {
                const originalWidth = 600;
                const originalHeight = 750;

                // Dimensões visíveis do canvas (no layout do CSS)
                const rect = canvas.getBoundingClientRect();
                const currentWidth = rect.width;
                
                // Calcula a escala necessária
                const scaleFactor = currentWidth / originalWidth;
                
                // Redefine as dimensões internas de desenho
                canvas.width = originalWidth;
                canvas.height = originalHeight;

                // Aplica a escala para 'comprimir' o desenho
                ctx.setTransform(scaleFactor, 0, 0, scaleFactor, 0, 0);

                // Força o redesenho
                calculateCosts();
                draw();
            };

            // Adiciona listener para redimensionamento e chama ao carregar
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); 
        });
        // --- FIM DA CORREÇÃO AVANÇADA ---


        // --- ESTADO DA APLICAÇÃO ---
        const state = {
            inputs: {
                qtdBarras: { value: '5', label: 'Qtd. Barras de Ferro (6m)', unitPrice: 70 },
                qtdTinta: { value: '1', label: 'Qtd. Latas de Tinta (3,6L)', unitPrice: 75 },
                qtdEletrodos: { value: '2', label: 'Qtd. Pacotes de Eletrodo', unitPrice: 39 },
                horasTrabalho: { value: '8', label: 'Horas de Trabalho' },
                valorHora: { value: '55', label: 'Valor da Hora (R$)' },
                margemLucro: { value: '30', label: 'Margem de Lucro (%)' }
            },
            results: {
                custoMateriais: 0,
                custoMaoObra: 0,
                custoTotal: 0,
                valorMargem: 0,
                precoFinal: 0
            },
            activeInput: null,
            layout: {}
        };

        // --- FUNÇÕES AUXILIARES ---
        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // --- LÓGICA DE CÁLCULO ---
        function calculateCosts() {
            // Permite tanto vírgula quanto ponto para decimal
            const getNum = (key) => parseFloat(state.inputs[key].value.replace(',', '.')) || 0; 

            const custoBarras = getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice;
            const custoTinta = getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice;
            const custoEletrodos = getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice;
            
            const custoMaoObra = getNum('horasTrabalho') * getNum('valorHora');
            const custoMateriais = custoBarras + custoTinta + custoEletrodos;
            const custoTotal = custoMateriais + custoMaoObra;
            const margem = getNum('margemLucro') / 100;
            const valorMargem = custoTotal * margem;
            const precoFinal = custoTotal + valorMargem;

            state.results = { custoMateriais, custoMaoObra, custoTotal, valorMargem, precoFinal };
        }

        // --- LÓGICA DE RENDERIZAÇÃO (DESENHO) ---
        function draw() {
            // Limpa o canvas
            ctx.clearRect(0, 0, 600, 750); // Limpa as dimensões internas fixas 600x750
            ctx.setTransform(ctx.getTransform()); // Reseta a transformação de escala para garantir consistência

            // --- ESTILOS GLOBAIS ---
            const padding = 30;
            const inputHeight = 40; 
            const lineSpacing = 60; 
            let currentY = padding + 20;

            // --- TÍTULO DE ENTRADA ---
            ctx.font = 'bold 22px Arial'; 
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText('Entrada de Dados', padding, currentY);
            currentY += lineSpacing;

            // --- DESENHA INPUTS ---
            state.layout = {}; 
            ctx.font = '18px Arial'; 
            Object.keys(state.inputs).forEach(key => {
                const input = state.inputs[key];
                
                // Desenha o label
                ctx.fillStyle = '#555';
                ctx.fillText(input.label, padding, currentY + (inputHeight / 2) + 6);

                // Define a caixa do input
                const inputBox = {
                    x: 600 / 2, // Usa largura fixa interna 600
                    y: currentY,
                    width: 600 / 2 - padding,
                    height: inputHeight
                };
                state.layout[key] = inputBox; 

                // Desenha a borda do input
                ctx.strokeStyle = (state.activeInput === key) ? '#007BFF' : '#ccc'; // COR AZUL DE SELEÇÃO
                ctx.lineWidth = (state.activeInput === key) ? 3 : 1; // Borda mais grossa quando ativo
                ctx.strokeRect(inputBox.x, inputBox.y, inputBox.width, inputBox.height);

                // Desenha o valor dentro do input
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';
                const displayValue = input.value || (state.activeInput === key ? '' : '0'); 
                ctx.fillText(displayValue, inputBox.x + 10, currentY + (inputHeight / 2) + 6);

                // Desenha o cursor se o campo estiver ativo (somente para desktop, visual)
                if (state.activeInput === key && !('ontouchstart' in window)) {
                    const textWidth = ctx.measureText(displayValue).width;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(inputBox.x + 10 + textWidth + 2, inputBox.y + 8, 2, inputBox.height - 16);
                }

                currentY += lineSpacing;
            });
            
            // --- SEPARADOR e RESULTADOS (MANTIDO) ---
            currentY += 20;
            ctx.beginPath();
            ctx.moveTo(padding, currentY);
            ctx.lineTo(600 - padding, currentY); // Usa largura fixa interna 600
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 2;
            ctx.stroke();
            currentY += padding + 10;
            
            // --- TÍTULO DE RESULTADO ---
            ctx.font = 'bold 22px Arial'; 
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText('Resultado do Orçamento', padding, currentY);
            currentY += lineSpacing;

            const resultsLayout = [
                { label: 'Custo Total de Materiais', value: formatCurrency(state.results.custoMateriais) },
                { label: 'Custo Total da Mão de Obra', value: formatCurrency(state.results.custoMaoObra) },
                { label: 'Custo Total do Serviço', value: formatCurrency(state.results.custoTotal), bold: true },
                { label: `Margem Aplicada (${state.inputs.margemLucro.value || 0}%)`, value: formatCurrency(state.results.valorMargem) },
                { label: 'Preço Final Sugerido', value: formatCurrency(state.results.precoFinal), final: true },
            ];
            
            resultsLayout.forEach(item => {
                ctx.textAlign = 'left';
                ctx.fillStyle = '#555';
                ctx.font = item.bold ? 'bold 18px Arial' : '18px Arial'; 
                ctx.fillText(item.label, padding, currentY);

                ctx.textAlign = 'right';
                if (item.final) {
                    ctx.font = 'bold 28px Arial'; 
                    ctx.fillStyle = '#28a745'; 
                } else if (item.bold) {
                    ctx.fillStyle = '#333';
                }
                ctx.fillText(item.value, 600 - padding, currentY); // Usa largura fixa interna 600

                currentY += 45; 
            });
        }

        // --- FUNÇÕES DE CONTROLE DE INPUT AUXILIAR (CORRIGIDAS) ---

        function activateAuxiliaryInput(key, targetRect) { 
            if (!key) return;

            // 1. Sincroniza o valor do estado para o input real
            auxiliaryInput.value = state.inputs[key].value;
            
            // 2. Posiciona o input auxiliar
            auxiliaryInput.style.opacity = '0.01'; 
            auxiliaryInput.style.left = `${targetRect.left}px`;
            auxiliaryInput.style.top = `${targetRect.top}px`;
            auxiliaryInput.style.width = `${targetRect.width}px`;
            auxiliaryInput.style.height = `${targetRect.height}px`;
            auxiliaryInput.style.zIndex = '9999'; 

            // 3. Usa setTimeout para forçar o foco após a posição ser processada (CORREÇÃO CHAVE)
            setTimeout(() => {
                auxiliaryInput.focus();
            }, 50); 
        }

        function deactivateAuxiliaryInput() {
            // Volta o input para o estado invisível e fora da área de interação
            auxiliaryInput.style.opacity = '0';
            auxiliaryInput.style.left = '0px';
            auxiliaryInput.style.top = '0px';
            auxiliaryInput.style.width = '1px';
            auxiliaryInput.style.height = '1px';
            auxiliaryInput.style.zIndex = '-10'; 

            state.activeInput = null;
            draw();
            auxiliaryInput.blur();
        }

        // --- EVENT LISTENERS (CLIQUE/TOQUE) ---
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            
            // Calcula as coordenadas do clique ajustadas para a escala de desenho (600x750)
            const scaleX = canvas.width / rect.width; 
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            let clickedOnInput = false;
            Object.keys(state.layout).forEach(key => {
                const box = state.layout[key];
                if (x >= box.x && x <= box.x + box.width && y >= box.y && y <= box.y + box.height) {
                    
                    // Se o usuário clicar no campo ativo, não precisa fazer nada (o teclado já está aberto)
                    if (state.activeInput === key) return;

                    state.activeInput = key;
                    clickedOnInput = true;
                    
                    // --- Calcula a posição do input na tela (viewport) ---
                    const inputScreenX = rect.left + box.x / scaleX;
                    const inputScreenY = rect.top + box.y / scaleY;
                    const inputScreenWidth = box.width / scaleX;
                    const inputScreenHeight = box.height / scaleY;

                    const targetRect = {
                        left: inputScreenX, 
                        top: inputScreenY, 
                        width: inputScreenWidth, 
                        height: inputScreenHeight
                    };

                    // Desenha imediatamente a cor de seleção
                    draw(); 
                    // Ativa o input auxiliar e abre o teclado
                    activateAuxiliaryInput(key, targetRect); 
                }
            });

            if (!clickedOnInput) {
                deactivateAuxiliaryInput(); // Fecha o teclado se clicar fora
            }

            if (!clickedOnInput && state.activeInput) {
                draw();
            }
        });

        // O input auxiliar captura todas as mudanças de valor (mobile e desktop)
        auxiliaryInput.addEventListener('input', () => {
            if (!state.activeInput) return;

            let value = auxiliaryInput.value;
            
            // Permite números e um único ponto decimal
            value = value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
            
            state.inputs[state.activeInput].value = value;

            calculateCosts();
            draw();
        });
        
        // Desfoca o input auxiliar quando o usuário pressiona "Enter" ou sai do campo
        // Usamos 'change' ou 'blur' para o foco sair.
        auxiliaryInput.addEventListener('blur', deactivateAuxiliaryInput);
        auxiliaryInput.addEventListener('change', deactivateAuxiliaryInput);

        // --- EVENT LISTENER (TECLADO FÍSICO/DESKTOP) ---
        window.addEventListener('keydown', (event) => {
            if (!state.activeInput) return;

            const key = event.key;
            
            if (key === 'Enter') {
                 // Força o desfoco para fechar o teclado virtual
                 deactivateAuxiliaryInput(); 
                 return; 
            }

            calculateCosts();
        });

    </script>

</body>
</html>
