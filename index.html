<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Custos em Canvas para Serralheria</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            padding: 20px;
            /* ADIÇÃO: Ajuste de largura para melhor visualização em mobile */
            width: 100%; 
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* --- ADIÇÃO PARA RESPONSIVIDADE --- */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            #simulatorCanvas {
                /* Faz o canvas se ajustar à largura da tela do celular */
                width: 100%; 
                /* Mantém a proporção do desenho mesmo com redimensionamento */
                max-width: 600px; 
                height: auto; 
            }
        }
        /* ---------------------------------- */
    </style>
</head>
<body>

    <h2>Simulador de Custos para Serralheria (Canvas)</h2>
    <canvas id="simulatorCanvas" width="600" height="750"></canvas>

    <input type="text" id="auxiliaryInput" style="position: absolute; top: -9999px; opacity: 0; pointer-events: none;">

    <script>
        const canvas = document.getElementById('simulatorCanvas');
        const ctx = canvas.getContext('2d');
        const auxiliaryInput = document.getElementById('auxiliaryInput'); // Novo elemento

        // --- ESTADO DA APLICAÇÃO ---
        const state = {
            inputs: {
                qtdBarras: { value: '5', label: 'Qtd. Barras de Ferro (6m)', unitPrice: 70 },
                qtdTinta: { value: '1', label: 'Qtd. Latas de Tinta (3,6L)', unitPrice: 75 },
                qtdEletrodos: { value: '2', label: 'Qtd. Pacotes de Eletrodo', unitPrice: 39 },
                horasTrabalho: { value: '8', label: 'Horas de Trabalho' },
                valorHora: { value: '55', label: 'Valor da Hora (R$)' },
                margemLucro: { value: '30', label: 'Margem de Lucro (%)' }
            },
            results: {
                custoMateriais: 0,
                custoMaoObra: 0,
                custoTotal: 0,
                valorMargem: 0,
                precoFinal: 0
            },
            activeInput: null, // Guarda a chave do input ativo (ex: 'qtdBarras')
            layout: {} // Posições dos elementos serão armazenadas aqui
        };

        // --- FUNÇÕES AUXILIARES ---
        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // --- LÓGICA DE CÁLCULO ---
        function calculateCosts() {
            const getNum = (key) => parseFloat(state.inputs[key].value) || 0;

            const custoBarras = getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice;
            const custoTinta = getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice;
            const custoEletrodos = getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice;
            
            const custoMaoObra = getNum('horasTrabalho') * getNum('valorHora');
            const custoMateriais = custoBarras + custoTinta + custoEletrodos;
            const custoTotal = custoMateriais + custoMaoObra;
            const margem = getNum('margemLucro') / 100;
            const valorMargem = custoTotal * margem;
            const precoFinal = custoTotal + valorMargem;

            state.results = { custoMateriais, custoMaoObra, custoTotal, valorMargem, precoFinal };
        }

        // --- LÓGICA DE RENDERIZAÇÃO (DESENHO) ---
        function draw() {
            // Limpa o canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ESTILOS GLOBAIS ---
            const padding = 30;
            const inputHeight = 35;
            const lineSpacing = 55;
            let currentY = padding + 20;

            // --- TÍTULO SEÇÃO DE ENTRADA ---
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText('Entrada de Dados', padding, currentY);
            currentY += lineSpacing;

            // --- DESENHA INPUTS ---
            state.layout = {}; // Reseta o layout para redesenhar
            ctx.font = '16px Arial';
            Object.keys(state.inputs).forEach(key => {
                const input = state.inputs[key];
                
                // Desenha o label
                ctx.fillStyle = '#555';
                ctx.fillText(input.label, padding, currentY + (inputHeight / 2) + 5);

                // Define a caixa do input
                const inputBox = {
                    x: canvas.width / 2,
                    y: currentY,
                    width: canvas.width / 2 - padding,
                    height: inputHeight
                };
                state.layout[key] = inputBox; // Armazena a posição

                // Desenha a borda do input
                ctx.strokeStyle = (state.activeInput === key) ? '#007BFF' : '#ccc'; // Borda azul se ativo
                ctx.lineWidth = (state.activeInput === key) ? 2 : 1;
                ctx.strokeRect(inputBox.x, inputBox.y, inputBox.width, inputBox.height);

                // Desenha o valor dentro do input
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';
                // Adiciona um placeholder visual se o campo estiver vazio
                const displayValue = input.value || (state.activeInput === key ? '' : '0'); 
                ctx.fillText(displayValue, inputBox.x + 10, currentY + (inputHeight / 2) + 5);

                // Desenha o cursor se o campo estiver ativo (somente para desktop, visual)
                if (state.activeInput === key && !('ontouchstart' in window)) {
                    const textWidth = ctx.measureText(displayValue).width;
                    ctx.fillStyle = '#000';
                    // Simula um cursor piscando (simplesmente desenha)
                    ctx.fillRect(inputBox.x + 10 + textWidth + 2, inputBox.y + 8, 2, inputBox.height - 16);
                }

                currentY += lineSpacing;
            });

            currentY += 20;
            ctx.beginPath();
