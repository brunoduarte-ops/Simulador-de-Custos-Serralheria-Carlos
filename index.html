<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Custos em Canvas para Serralheria</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            padding: 20px;
            /* ADIÇÃO: Ajuste de largura para melhor visualização em mobile */
            width: 100%; 
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* --- ADIÇÃO PARA RESPONSIVIDADE --- */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            #simulatorCanvas {
                /* Faz o canvas se ajustar à largura da tela do celular */
                width: 100%; 
                /* Mantém a proporção do desenho mesmo com redimensionamento */
                max-width: 600px; 
                height: auto; 
            }
        }
        /* ---------------------------------- */
    </style>
</head>
<body>

    <h2>Simulador de Custos para Serralheria (Canvas)</h2>
    <canvas id="simulatorCanvas" width="600" height="750"></canvas>

    <input type="text" id="auxiliaryInput" style="position: absolute; top: -9999px; opacity: 0; pointer-events: none;">

    <script>
        const canvas = document.getElementById('simulatorCanvas');
        const ctx = canvas.getContext('2d');
        const auxiliaryInput = document.getElementById('auxiliaryInput'); // Novo elemento

        // --- ESTADO DA APLICAÇÃO ---
        const state = {
            inputs: {
                qtdBarras: { value: '5', label: 'Qtd. Barras de Ferro (6m)', unitPrice: 70 },
                qtdTinta: { value: '1', label: 'Qtd. Latas de Tinta (3,6L)', unitPrice: 75 },
                qtdEletrodos: { value: '2', label: 'Qtd. Pacotes de Eletrodo', unitPrice: 39 },
                horasTrabalho: { value: '8', label: 'Horas de Trabalho' },
                valorHora: { value: '55', label: 'Valor da Hora (R$)' },
                margemLucro: { value: '30', label: 'Margem de Lucro (%)' }
            },
            results: {
                custoMateriais: 0,
                custoMaoObra: 0,
                custoTotal: 0,
                valorMargem: 0,
                precoFinal: 0
            },
            activeInput: null, // Guarda a chave do input ativo (ex: 'qtdBarras')
            layout: {} // Posições dos elementos serão armazenadas aqui
        };

        // --- FUNÇÕES AUXILIARES ---
        const formatCurrency = (value) => {
            return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        // --- LÓGICA DE CÁLCULO ---
        function calculateCosts() {
            const getNum = (key) => parseFloat(state.inputs[key].value) || 0;

            const custoBarras = getNum('qtdBarras') * state.inputs.qtdBarras.unitPrice;
            const custoTinta = getNum('qtdTinta') * state.inputs.qtdTinta.unitPrice;
            const custoEletrodos = getNum('qtdEletrodos') * state.inputs.qtdEletrodos.unitPrice;
            
            const custoMaoObra = getNum('horasTrabalho') * getNum('valorHora');
            const custoMateriais = custoBarras + custoTinta + custoEletrodos;
            const custoTotal = custoMateriais + custoMaoObra;
            const margem = getNum('margemLucro') / 100;
            const valorMargem = custoTotal * margem;
            const precoFinal = custoTotal + valorMargem;

            state.results = { custoMateriais, custoMaoObra, custoTotal, valorMargem, precoFinal };
        }

        // --- LÓGICA DE RENDERIZAÇÃO (DESENHO) ---
        function draw() {
            // Limpa o canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- ESTILOS GLOBAIS ---
            const padding = 30;
            const inputHeight = 35;
            const lineSpacing = 55;
            let currentY = padding + 20;

            // --- TÍTULO SEÇÃO DE ENTRADA ---
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText('Entrada de Dados', padding, currentY);
            currentY += lineSpacing;

            // --- DESENHA INPUTS ---
            state.layout = {}; // Reseta o layout para redesenhar
            ctx.font = '16px Arial';
            Object.keys(state.inputs).forEach(key => {
                const input = state.inputs[key];
                
                // Desenha o label
                ctx.fillStyle = '#555';
                ctx.fillText(input.label, padding, currentY + (inputHeight / 2) + 5);

                // Define a caixa do input
                const inputBox = {
                    x: canvas.width / 2,
                    y: currentY,
                    width: canvas.width / 2 - padding,
                    height: inputHeight
                };
                state.layout[key] = inputBox; // Armazena a posição

                // Desenha a borda do input
                ctx.strokeStyle = (state.activeInput === key) ? '#007BFF' : '#ccc'; // Borda azul se ativo
                ctx.lineWidth = (state.activeInput === key) ? 2 : 1;
                ctx.strokeRect(inputBox.x, inputBox.y, inputBox.width, inputBox.height);

                // Desenha o valor dentro do input
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';
                // Adiciona um placeholder visual se o campo estiver vazio
                const displayValue = input.value || (state.activeInput === key ? '' : '0'); 
                ctx.fillText(displayValue, inputBox.x + 10, currentY + (inputHeight / 2) + 5);

                // Desenha o cursor se o campo estiver ativo (somente para desktop, visual)
                if (state.activeInput === key && !('ontouchstart' in window)) {
                    const textWidth = ctx.measureText(displayValue).width;
                    ctx.fillStyle = '#000';
                    // Simula um cursor piscando (simplesmente desenha)
                    ctx.fillRect(inputBox.x + 10 + textWidth + 2, inputBox.y + 8, 2, inputBox.height - 16);
                }

                currentY += lineSpacing;
            });
            
            // --- SEPARADOR ---
            currentY += 20;
            ctx.beginPath();
            ctx.moveTo(padding, currentY);
            ctx.lineTo(canvas.width - padding, currentY);
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 2;
            ctx.stroke();
            currentY += padding + 10;
            
            // --- TÍTULO SEÇÃO DE RESULTADOS ---
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'left';
            ctx.fillText('Resultado do Orçamento', padding, currentY);
            currentY += lineSpacing;

            // --- DESENHA RESULTADOS ---
            const resultsLayout = [
                { label: 'Custo Total de Materiais', value: formatCurrency(state.results.custoMateriais) },
                { label: 'Custo Total da Mão de Obra', value: formatCurrency(state.results.custoMaoObra) },
                { label: 'Custo Total do Serviço', value: formatCurrency(state.results.custoTotal), bold: true },
                { label: `Margem Aplicada (${state.inputs.margemLucro.value || 0}%)`, value: formatCurrency(state.results.valorMargem) },
                { label: 'Preço Final Sugerido', value: formatCurrency(state.results.precoFinal), final: true },
            ];
            
            resultsLayout.forEach(item => {
                ctx.textAlign = 'left';
                ctx.fillStyle = '#555';
                ctx.font = item.bold ? 'bold 16px Arial' : '16px Arial';
                ctx.fillText(item.label, padding, currentY);

                ctx.textAlign = 'right';
                if (item.final) {
                    ctx.font = 'bold 22px Arial';
                    ctx.fillStyle = '#28a745'; // Verde para o preço final
                } else if (item.bold) {
                    ctx.fillStyle = '#333';
                }
                ctx.fillText(item.value, canvas.width - padding, currentY);

                currentY += 40;
            });
        }

        // --- FUNÇÕES DE CONTROLE DE INPUT AUXILIAR (MOBILE) ---

        function activateAuxiliaryInput(key) {
            if (!key) return;

            // 1. Sincroniza o valor do estado para o input real
            auxiliaryInput.value = state.inputs[key].value;
            auxiliaryInput.type = 'number'; // Sugere teclado numérico no celular
            auxiliaryInput.style.pointerEvents = 'auto'; 
            
            // 2. Tenta focar no input real para abrir o teclado virtual
            setTimeout(() => {
                auxiliaryInput.focus();
            }, 10);
        }

        function deactivateAuxiliaryInput() {
            auxiliaryInput.blur();
            auxiliaryInput.style.pointerEvents = 'none'; // Desativa o input
            state.activeInput = null;
            draw();
        }

        // --- EVENT LISTENERS (CLIQUE E TOQUE) ---
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            // Ajusta as coordenadas x e y para a escala do canvas, importante para responsividade
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            let clickedOnInput = false;
            Object.keys(state.layout).forEach(key => {
                const box = state.layout[key];
                if (x >= box.x && x <= box.x + box.width && y >= box.y && y <= box.y + box.height) {
                    state.activeInput = key;
                    clickedOnInput = true;
                    activateAuxiliaryInput(key); // Ativa o input auxiliar
                }
            });

            if (!clickedOnInput) {
                deactivateAuxiliaryInput(); // Desativa se clicar fora
            }

            draw(); // Redesenha para mostrar a seleção
        });

        // O input auxiliar captura todas as mudanças de valor no mobile/desktop
        auxiliaryInput.addEventListener('input', () => {
            if (!state.activeInput) return;

            let value = auxiliaryInput.value;
            
            // Garante que só números e um ponto decimal sejam inseridos
            value = value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
            
            state.inputs[state.activeInput].value = value;

            calculateCosts();
            draw();
        });
        
        // Desfoca o input auxiliar quando o usuário pressiona "Enter" ou similar no teclado virtual
        auxiliaryInput.addEventListener('change', deactivateAuxiliaryInput);

        // --- EVENT LISTENER (TECLADO FÍSICO/DESKTOP) ---
        // Mantém a lógica de teclado direto para uma experiência melhor no desktop
        window.addEventListener('keydown', (event) => {
            if (!state.activeInput) return;

            const key = event.key;
            const input = state.inputs[state.activeInput];

            // Bloqueia a ação padrão para evitar que o input auxiliar reaja se estiver ativo
            event.preventDefault(); 
            
            if (key === 'Backspace') {
                input.value = input.value.slice(0, -1);
                auxiliaryInput.value = input.value; // Sincroniza o input auxiliar
            } else if (!isNaN(key) || (key === '.' && !input.value.includes('.'))) {
                // Permite números e um único ponto decimal
                input.value += key;
                auxiliaryInput.value = input.value; // Sincroniza o input auxiliar
            } else if (key === 'Enter') {
                 // Desativa o foco se a tecla Enter for pressionada
                deactivateAuxiliaryInput(); 
                return; 
            }

            calculateCosts();
            draw();
        });

        // --- INICIALIZAÇÃO ---
        calculateCosts();
        draw();

    </script>

</body>
</html>
