<style>
        /* ... outros estilos ... */

        canvas {
            /* Mantém a lógica original do canvas */
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* --- ADIÇÃO PARA RESPONSIVIDADE --- */
        @media (max-width: 700px) {
            /* Limita a largura máxima do body para evitar que o canvas fique muito grande */
            body {
                width: 100%;
                max-width: 600px; /* Limita o tamanho geral para mobile */
            }
            #simulatorCanvas {
                width: 100%; /* Ocupa 100% da largura do container */
                height: auto; /* A altura é ajustada automaticamente para manter a proporção */
            }
        }
        /* ---------------------------------- */
    </style>
